[package]
name = "retreat_engine"
description = "Retreat engine runtime: RetreatEnginePlugin and the systems every Retreat game runs."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# `wav`: Bevy decodes only .ogg by default; the sandbox test sounds are .wav (adds the `hound` crate).
bevy = { workspace = true, features = ["wav", "serialize"] }
postcard.workspace = true
serde.workspace = true
bevy_rapier3d.workspace = true
retreat_engine_api.workspace = true
retreat_rng.workspace = true
# Encodes snapshots as PNG on every platform (native writes the file, the browser keeps it in
# memory). Same version and features Bevy already uses.
image = { version = "0.25", default-features = false, features = ["png"] }

# The browser bridge (src/platform/wasm.rs): JS bindings, fetch, and running async startup.
# Versions match what Bevy and winit already pull in (see Cargo.lock).
# Native only: WebTransport server and client (platform/native_transport.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wtransport.workspace = true
tokio.workspace = true
rustls.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = ["Window", "Document", "Element", "Location", "Response", "UrlSearchParams", "Storage", "console"] }

# Tests that run in headless Chrome (src/platform/wasm_tests.rs, scripts/web/test_wasm.sh).
# The version matches the wasm-bindgen crate (see Cargo.lock): wasm-bindgen-cli 0.2.130 runs them.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.80"
