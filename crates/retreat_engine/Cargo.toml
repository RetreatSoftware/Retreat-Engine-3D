[package]
name = "retreat_engine"
description = "Retreat engine runtime: RetreatEnginePlugin and the systems every Retreat game runs."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# `wav`: Bevy decodes only .ogg by default; the sandbox test sounds are .wav (adds the `hound` crate).
bevy = { workspace = true, features = ["wav"] }
bevy_rapier3d.workspace = true
retreat_engine_api.workspace = true
# Encodes snapshots as PNG on every platform (native writes the file, the browser keeps it in
# memory). Same version and features Bevy already uses.
image = { version = "0.25", default-features = false, features = ["png"] }

# The browser bridge (src/platform/wasm.rs): JS bindings, fetch, and running async startup.
# Versions match what Bevy and winit already pull in (see Cargo.lock).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = ["Window", "Location", "Response", "UrlSearchParams", "Storage", "console"] }

