[package]
name = "retreat_engine_api"
description = "Retreat engine contract: the only engine crate gameplay modules may depend on (commands, simulation RNG, physics body descriptions)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# `serialize`: Vec3 and Quat can be serialized (network messages).
bevy = { workspace = true, features = ["serialize"] }
serde.workspace = true
# Encodes module state (`NetState`).
postcard.workspace = true
retreat_rng.workspace = true
serde_json.workspace = true
