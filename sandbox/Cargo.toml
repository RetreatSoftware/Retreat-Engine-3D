[package]
name = "retreat_sandbox"
description = "Retreat Engine Sandbox: a small app that exercises every engine feature."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bevy.workspace = true
retreat_engine.workspace = true
retreat_engine_api.workspace = true
retreat_module_spawner.workspace = true
retreat_module_orbit_camera.workspace = true
retreat_module_sfx.workspace = true
retreat_module_fox_walk.workspace = true
retreat_module_highscore.workspace = true

# Hot reload: on native, Bevy watches `assets/` and reloads a texture, model or shader the
# moment its file changes on disk. The browser has no file watcher, so this is native-only
# (resolver "3" applies target-specific features only to that target).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["file_watcher"] }
