# Retreat-Engine-3D workspace.
#
# The Bevy version is pinned once, in [workspace.dependencies] below. Every crate
# that uses Bevy declares `bevy.workspace = true` (a direct dependency): Bevy's
# derive macros look for `bevy` in the using crate's own Cargo.toml, so Bevy
# cannot be reached only through a re-export.

[workspace]
resolver = "3"
members = [
    "crates/retreat_engine_api",
    "crates/retreat_engine",
    "sandbox",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
bevy = "0.20.1"
# JSON for the save format (retreat_engine_api re-exports it; already in Cargo.lock through Bevy).
serde_json = "1"
retreat_engine_api = { path = "crates/retreat_engine_api" }
retreat_engine = { path = "crates/retreat_engine" }
# CoreSDK is a separate repository. Cargo.lock pins the exact commit, so builds are
# reproducible; run `cargo update -p retreat_rng` to pick up a newer CoreSDK commit.
retreat_rng = { git = "https://github.com/RetreatSoftware/Retreat-CoreSDK" }
# Gameplay modules (Retreat-Modules repository). Same rule as CoreSDK: a git dependency,
# Cargo.lock pins the commit, `cargo update -p retreat_module_spawner` takes a newer one.
retreat_module_spawner = { git = "https://github.com/RetreatSoftware/Retreat-Modules" }
retreat_module_orbit_camera = { git = "https://github.com/RetreatSoftware/Retreat-Modules" }
retreat_module_sfx = { git = "https://github.com/RetreatSoftware/Retreat-Modules" }
retreat_module_fox_walk = { git = "https://github.com/RetreatSoftware/Retreat-Modules" }
retreat_module_highscore = { git = "https://github.com/RetreatSoftware/Retreat-Modules" }
# Physics. 0.37 is the release for Bevy 0.20. Default features are off: they add a debug
# renderer, picking and async mesh colliders we do not use. `enhanced-determinism` makes
# the simulation bit-identical across platforms (native and WASM), which `state.hash` checks.
bevy_rapier3d = { version = "0.37.0", default-features = false, features = ["dim3", "enhanced-determinism"] }

# Bevy is slow in an unoptimized build. Optimize dependencies fully and our own
# code a little, so `cargo run` stays playable while compile times stay short.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Browser builds (scripts/web/build.sh): the dev settings without debug info, so the browser
# does not download it (build.sh also drops the function-name section with wasm-bindgen).
[profile.web-dev]
inherits = "dev"
debug = false

# Modules depend on retreat_engine_api through git (they live in another repository). Inside
# this workspace that must be the same crate as our local crates/retreat_engine_api, or the
# module's CommandRegistry and ours would be two different types. This redirects their git
# dependency to the local path.
[patch."https://github.com/RetreatSoftware/Retreat-Engine-3D"]
retreat_engine_api = { path = "crates/retreat_engine_api" }
