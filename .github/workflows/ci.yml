# Native build + tests and a wasm32 check on every push and pull request.
# Keeping both targets green from the start is a rule in CLAUDE.md.
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bevy's Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      # Headless snapshot checks on the CPU renderer (lavapipe): CI machines have no GPU.
      - name: Install the lavapipe software Vulkan driver
        run: sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - name: Run scripts/verify headless
        run: |
          for script in scripts/verify/*.cmds; do
            echo "::group::$script"
            cargo run -p retreat_sandbox -- --headless --software-renderer --commands "$script"
            echo "::endgroup::"
          done
      - name: Network check (a server and two clients, real WebTransport on localhost)
        run: |
          cargo build -p retreat_sandbox
          node scripts/verify/network/run.mjs --software-renderer
      - name: Players check (the players module over real WebTransport)
        run: node scripts/verify/network/run.mjs --scenario players --software-renderer
      - name: Hot reload check (changes a texture file while the app runs)
        run: scripts/verify/hot_reload_texture.sh --software-renderer
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: target/snapshots/
          if-no-files-found: warn

  wasm32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --target wasm32-unknown-unknown

  # The browser build, driven like a player's browser: every scripts/verify script runs in
  # headless Chrome (SwiftShader WebGL2) through window.__retreat; scripts that assert a
  # state.hash must match the native value, which proves native/WASM determinism.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli (the version Cargo.lock pins)
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          if ! wasm-bindgen --version 2>/dev/null | grep -qx "wasm-bindgen $version"; then
            cargo install wasm-bindgen-cli --version "$version" --locked
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: scripts/web/build.sh
      - name: Install Bevy's Linux system libraries (the network check runs the native sandbox)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev mesa-vulkan-drivers
      - name: Network check with a browser client (native server and client, browser client B)
        run: |
          cargo build -p retreat_sandbox
          node scripts/verify/network/run.mjs --browser --software-renderer
      - name: Run scripts/verify in headless Chrome
        run: |
          for script in scripts/verify/*.cmds; do
            echo "::group::$script"
            node scripts/web/run_in_browser.mjs "$script"
            echo "::endgroup::"
          done
      - name: Upload browser snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-snapshots
          path: target/snapshots/web/
          if-no-files-found: warn
