<!doctype html>
<!-- The page of every Retreat game's browser build. A template: scripts/web/build_web.mjs fills in
     {{TITLE}} and {{WASM_NAME}} and writes it as <output>/index.html.
     Launch options come from the URL: ?commands=scripts/verify/<name>.cmds&seed=<n>. A page served
     by a game server (--serve-web) joins that server by itself.
     Agents drive it through window.__retreat (see crates/retreat_engine/src/platform/wasm.rs). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1e1f22; overflow: hidden; }
      #retreat-canvas { display: block; width: 100%; height: 100%; outline: none; }
      /* What the player is told over the game: loading, or why it stopped. */
      #retreat-notice {
        position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: 90%;
        padding: 10px 16px; border-radius: 6px; background: rgba(0, 0, 0, 0.8); color: #fff;
        font: 16px system-ui, sans-serif; text-align: center;
      }
      #retreat-notice[hidden] { display: none; }
    </style>
  </head>
  <body>
    <canvas id="retreat-canvas"></canvas>
    <div id="retreat-notice">Loading…</div>
    <script>
      // Shows `text` over the game; an empty text hides the notice.
      window.__retreatNotice = (text) => {
        const notice = document.getElementById("retreat-notice");
        notice.textContent = text;
        notice.hidden = text === "";
      };
    </script>
    <!-- Networking: the browser half of the WebTransport client (the Rust half is
         crates/retreat_engine/src/platform/wasm_transport.rs). `connect` starts a session, `send` sends
         one datagram, `poll` returns what happened since the last call as byte arrays whose first byte
         is the kind: 0 connected, 1 datagram (rest = payload), 2 disconnected (rest = reason, UTF-8).
         A hex SHA-256 pins a self-signed certificate (serverCertificateHashes). Nothing here blocks. -->
    <script>
      (() => {
        const events = [];
        let writer = null;
        const encoder = new TextEncoder();
        const withKind = (kind, payload) => {
          const bytes = new Uint8Array(1 + payload.length);
          bytes[0] = kind;
          bytes.set(payload, 1);
          return bytes;
        };
        const hexToBytes = (hex) => Uint8Array.from(hex.match(/../g).map((pair) => parseInt(pair, 16)));
        const lost = (reason) => {
          events.push(withKind(2, encoder.encode(reason)));
          window.__retreatNotice(`No connection to the game server (${reason}). Reload the page to try again.`);
        };
        window.__retreatNet = {
          connect(url, certificateHashHex) {
            if (typeof WebTransport === "undefined") {
              lost(window.isSecureContext ? "this browser has no WebTransport" : "open the page with https://");
              return;
            }
            const options = certificateHashHex
              ? { serverCertificateHashes: [{ algorithm: "sha-256", value: hexToBytes(certificateHashHex) }] }
              : {};
            const session = new WebTransport(url, options);
            session.closed.then(
              () => lost("the session closed"),
              (error) => lost(String(error)),
            );
            session.ready.then(async () => {
              writer = session.datagrams.writable.getWriter();
              events.push(withKind(0, new Uint8Array(0)));
              const reader = session.datagrams.readable.getReader();
              for (;;) {
                const { value, done } = await reader.read();
                if (done) break;
                events.push(withKind(1, value));
              }
            }, () => {});
          },
          send(bytes) {
            if (writer) writer.write(bytes.slice()).catch(() => {});
          },
          poll() {
            return events.splice(0, events.length);
          },
        };
      })();
    </script>
    <!-- Audio and the browser's autoplay rule: a page may not make sound until the player has
         clicked or pressed a key on it. Audio contexts the engine creates start "suspended";
         this wraps the AudioContext constructor (before the engine starts) to remember them and
         resumes them on the first gesture. Sounds are still "playing" for scripts meanwhile
         (the engine decides that from simulation time). __retreat.audioState() lists the states. -->
    <script>
      (() => {
        const Original = window.AudioContext || window.webkitAudioContext;
        const contexts = [];
        if (Original) {
          window.AudioContext = class extends Original {
            constructor(...args) {
              super(...args);
              contexts.push(this);
            }
          };
        }
        const resumeAll = () => contexts.forEach((context) => context.state === "suspended" && context.resume());
        for (const type of ["pointerdown", "keydown", "touchend"]) {
          window.addEventListener(type, resumeAll, { capture: true });
        }
        window.__retreatAudioStates = () => contexts.map((context) => context.state);
      })();
    </script>
    <script type="module">
      import init, {
        retreatCommand,
        retreatStatus,
        retreatSnapshotPng,
        retreatSnapshotNames,
      } from "./{{WASM_NAME}}.js";

      // The agent-facing bridge. Every call goes through the engine's command registry.
      //   await __retreat.command("physics.spawn_box a 0 3 0 1")  -> "ok" (rejects with the error)
      //   __retreat.status()        -> {script: "loading" | "starting" | "none" | "running" | "passed" | "failed", ...}
      //                                ("loading" until the .wasm has loaded and started)
      //   await __retreat.snapshot("name") -> PNG data URL (runs `snapshot <name>` first)
      //   __retreat.snapshotPng("name")    -> PNG data URL of a snapshot a script took, or null
      //   __retreat.snapshotNames()        -> names of stored snapshots
      //   __retreat.audioState()           -> state of each audio context ("suspended" until a gesture)
      const pngDataUrl = (bytes) =>
        new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(new Blob([bytes], { type: "image/png" }));
        });
      let loaded = false;
      window.__retreat = {
        command: (line) => retreatCommand(line),
        status: () => (loaded ? JSON.parse(retreatStatus()) : { script: "loading" }),
        snapshot: async (name = "bridge") => {
          await retreatCommand(`snapshot ${name}`);
          return pngDataUrl(retreatSnapshotPng(name));
        },
        snapshotPng: async (name) => {
          const bytes = retreatSnapshotPng(name);
          return bytes ? pngDataUrl(bytes) : null;
        },
        snapshotNames: () => retreatSnapshotNames(),
        audioState: () => window.__retreatAudioStates(), // e.g. ["suspended"] until a click or key press
      };
      init().then(
        () => {
          loaded = true;
          // A connection that already failed keeps its message.
          const notice = document.getElementById("retreat-notice");
          if (notice.textContent === "Loading…") window.__retreatNotice("");
        },
        (error) => window.__retreatNotice(`The game could not start: ${error}`),
      );
    </script>
  </body>
</html>
